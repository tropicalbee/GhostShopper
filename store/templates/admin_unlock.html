{% extends "base.html" %}
{% block title %}Settings locked | {{ store_name }}{% endblock %}
{% block content %}
<div class="container narrow-page">
  <div class="panel">
    <h1>Settings locked</h1>
    <p>The demo flaw settings need the admin password on this server.</p>
    {% if wrong %}<p class="errors" role="alert">That password was not right.</p>{% endif %}
    <form class="details-form" method="post" action="{{ base }}/admin/unlock">
      <label>Password <input type="password" name="token" autocomplete="off" required></label>
      <button type="submit">Unlock</button>
    </form>
  </div>
</div>
{% endblock %}
