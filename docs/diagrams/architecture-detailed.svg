            <path d="M440,70 V64 Q440,56 448,56 H852 Q860,56 860,64 V70" marker-end="url(#open-muted)"></path>
            <path d="M900,134 V167 Q900,175 908,175 H1100" marker-end="url(#open-muted)"></path>
          </g>

