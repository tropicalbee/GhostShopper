            <line x1="740" y1="272" x2="800" y2="272" marker-end="url(#open)"></line>
            <path d="M740,300 H762 Q770,300 770,308 V504 Q770,512 778,512 H800" marker-end="url(#open)"></path>
            <line x1="630" y1="424" x2="630" y2="480" marker-end="url(#open)"></line>
            <line x1="910" y1="304" x2="910" y2="360" marker-end="url(#open)"></line>
