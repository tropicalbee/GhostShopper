        <!-- text, kept crisp outside the hand-drawn filter -->
        <g font-family="'Architects Daughter', 'Comic Sans MS', cursive" fill="#1e1e1e">
          <text x="36" y="412" font-size="15" fill="#555555">Merchant’s browser</text>
          <text x="296" y="842" font-size="15" fill="#555555">GhostShopper server, one FastAPI process</text>
          <text x="760" y="186" font-size="14" fill="#555555">the shopper agent</text>
          <text x="516" y="660" font-size="14" fill="#555555">the demo store</text>
          <text x="1096" y="842" font-size="15" fill="#555555">outside</text>

          <g font-size="17" text-anchor="middle">
            <text x="140" y="340">Dashboard</text>
            <text x="390" y="98">Runs API</text>
            <text x="620" y="98">Agent service</text>
            <text x="860" y="98">Fix wording</text>
            <text x="630" y="266">Shopper loop</text>
            <text x="910" y="266">Browser tools</text>
            <text x="630" y="386">Check engine</text>
            <text x="910" y="386">Pay flows</text>
            <text x="630" y="506">Recorder</text>
            <text x="910" y="506">Order read-back</text>
            <text x="630" y="694">Store pages</text>
            <text x="910" y="694">Checkout API</text>
            <text x="390" y="326">Score and trace</text>
            <text x="390" y="676">SQLite</text>
            <text x="1230" y="98">Channel3</text>
            <text x="1230" y="266">Language model</text>
            <text x="1230" y="386">Browser</text>
            <text x="1230" y="506">Your store (live)</text>
            <text x="1230" y="676">PayPal</text>
          </g>
          <g font-family="'Geist Mono', ui-monospace, monospace" font-size="10.5" fill="#555555" text-anchor="middle">
            <text x="140" y="360">react + vite</text><text x="140" y="378">live and results pages</text>
            <text x="390" y="118">runs.py, /api/runs</text>
            <text x="620" y="118">agent/service.py</text>
            <text x="860" y="118">explain.py, uses the model</text>
            <text x="630" y="286">agent/loop.py</text><text x="630" y="304">loop, budget, password guards</text>
            <text x="910" y="286">agent/browser.py</text>
            <text x="630" y="406">engine.py + checks.py</text>
            <text x="910" y="406">paypal_flow, vault_flow</text>
            <text x="630" y="526">agent/recorder.py</text>
            <text x="910" y="526">agent/order_page.py</text>
            <text x="630" y="714">store/app.py</text><text x="630" y="732">flaws.py toggles</text>
            <text x="910" y="714">/api/paypal, orders.py</text><text x="910" y="732">store/orders.py</text>
            <text x="390" y="346">scoring.py, trace.py</text><text x="390" y="364">no model involved</text>
            <text x="390" y="696">runs, steps, checks</text><text x="390" y="714">orders, store_orders</text><text x="390" y="732">scores</text>
            <text x="1230" y="118">market check, not scored</text>
            <text x="1230" y="286">nemotron or groq</text><text x="1230" y="304">scripted navigator without a key</text>
            <text x="1230" y="406">playwright here, kernel hosted</text>
            <text x="1230" y="526">any link, browse only</text>
            <text x="1230" y="696">orders v2: create, capture</text><text x="1230" y="714">popup: the buyer approves</text><text x="1230" y="732">sandbox, or mock in practice</text>
          </g>

          <!-- step numbers -->
          <g font-family="'Geist Mono', ui-monospace, monospace" font-size="11" font-weight="500" fill="#fbfaf7" text-anchor="middle">
            <text x="140" y="204">1</text><text x="192" y="234">12</text>
            <text x="500" y="106">2</text><text x="600" y="224">2</text>
            <text x="900" y="204">3</text>
            <text x="770" y="276">4</text><text x="1060" y="334">4</text><text x="1070" y="524">4</text><text x="1230" y="456">4</text>
            <text x="630" y="342">5</text>
            <text x="630" y="456">6</text><text x="410" y="594">6</text>
            <text x="810" y="314">7</text><text x="770" y="710">7</text><text x="1060" y="734">7</text>
            <text x="1050" y="564">8</text>
            <text x="650" y="824">9</text>
            <text x="910" y="456">10</text><text x="770" y="604">10</text>
            <text x="390" y="221">11</text><text x="390" y="564">11</text>
          </g>

          <!-- what happens, in order -->
          <text x="40" y="896" font-size="18">What happens during one check</text>
          <g font-size="15" fill="#1e1e1e">
            <text x="40" y="928">1  You start a check from the dashboard.</text>
            <text x="40" y="952">2  The runs API prepares a browser and the model, then starts the loop.</text>
            <text x="40" y="976">3  The model picks the next tool. Page text goes in as data, never as orders.</text>
            <text x="40" y="1000">4  The tool acts in the browser, on the demo store or a live store.</text>
            <text x="40" y="1024">5  The check engine judges what the browser saw, with no model.</text>
            <text x="40" y="1048">6  The step, its screenshot and the checks are written to SQLite.</text>
            <text x="720" y="928">7  At checkout the store makes its own order and a PayPal order.</text>
            <text x="720" y="952">8  The buyer approves in PayPal’s popup, and PayPal captures.</text>
            <text x="720" y="976">9  The store settles its order. The flaws decide what it writes.</text>
            <text x="720" y="1000">10  Our code, not the model, reads the order page back.</text>
            <text x="720" y="1024">11  On request, the score and the trace are built from SQLite.</text>
            <text x="720" y="1048">12  The dashboard polls and shows Live, then Results.</text>
          </g>
        </g>
      </svg>
