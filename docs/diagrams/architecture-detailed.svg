          <marker id="architecture-detailed-open-muted" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polyline points="0 0, 9 4, 0 8" fill="none" stroke="#6b6b6b" stroke-width="1.4"/></marker>
        </defs>
