<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1400 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-detailed-title architecture-detailed-desc" id="diagram-root">
        <title id="architecture-detailed-title">GhostShopper, the detailed sketch</title>
        <desc id="architecture-detailed-desc">A check starts from the dashboard. The runs API prepares the agent. The shopper loop asks the model for each tool, acts through the browser tools on the store, and has every step judged and logged. The pay flow drives the PayPal popup while the store's checkout API creates and captures the order and settles the store's own order. The order page is read back through the browser. On request the runs API builds the score and trace from SQLite and the dashboard shows Live, then Results. Side requests: the market check asks Channel3, and the fix wording asks the model.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Architects+Daughter&amp;family=Geist+Mono:wght@400;500&amp;display=swap');</style>
          <filter id="sketchy" x="-2%" y="-2%" width="104%" height="104%">
            <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7"></feTurbulence>
            <feDisplacementMap in="SourceGraphic" scale="2"></feDisplacementMap>
          </filter>
          <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <line x1="0" y1="0" x2="0" y2="9" stroke="#1e1e1e" stroke-opacity="0.06" stroke-width="2.5"></line>
          </pattern>
          <marker id="open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polyline points="0 0, 9 4, 0 8" fill="none" stroke="#1e1e1e" stroke-width="1.4"></polyline></marker>
          <marker id="open-muted" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polyline points="0 0, 9 4, 0 8" fill="none" stroke="#6b6b6b" stroke-width="1.4"></polyline></marker>
        </defs>
        <rect width="100%" height="100%" fill="#fbfaf7"></rect>

