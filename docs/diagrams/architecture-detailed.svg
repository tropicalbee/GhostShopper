<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1400 1060" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-detailed-title architecture-detailed-desc" id="architecture-detailed-root">
        <title id="architecture-detailed-title">GhostShopper, the detailed sketch</title>
        <desc id="architecture-detailed-desc">A check starts from the dashboard; the runs API prepares the agent; the shopper loop asks the model for each tool, acts through the browser on the store, has every step judged and logged; the pay flow drives PayPal’s popup while the store’s checkout API creates and captures the order and settles the store’s own order; the runtime reads the order page back; on request the runs API builds the score and trace from SQLite and the dashboard shows Live, then Results.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #architecture-detailed-root { --paper: #fbfaf7; --ink: #1e1e1e; --muted: #555555; --font-hand: 'Architects Daughter', 'Comic Sans MS', cursive; }
      #architecture-detailed-root { font-family: var(--font-hand); color: var(--ink); }
      #architecture-detailed-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#architecture-detailed-root .diagram-container { overflow-x: visible; }
}</style>
