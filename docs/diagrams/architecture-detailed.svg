            <path d="M300,122 H200 Q192,122 192,130 V310" marker-end="url(#open)"></path>
            <line x1="480" y1="102" x2="520" y2="102" marker-end="url(#open)"></line>
            <path d="M690,240 V208 Q690,200 698,200 H1100" marker-end="url(#open)"></path>
            <line x1="1020" y1="512" x2="1100" y2="512" marker-end="url(#open)"></line>
            <line x1="630" y1="316" x2="630" y2="360" marker-end="url(#open)"></line>
            <path d="M520,520 H468 Q460,520 460,528 V650" marker-end="url(#open)"></path>
            <line x1="740" y1="706" x2="800" y2="706" marker-end="url(#open)"></line>
