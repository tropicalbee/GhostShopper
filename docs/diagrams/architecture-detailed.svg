          <g fill="#1e1e1e">
            <circle cx="140" cy="200" r="12"/><circle cx="192" cy="230" r="12"/>
            <circle cx="500" cy="102" r="12"/><circle cx="600" cy="220" r="12"/>
            <circle cx="900" cy="200" r="12"/>
            <circle cx="770" cy="272" r="12"/><circle cx="1060" cy="330" r="12"/><circle cx="1070" cy="520" r="12"/><circle cx="1230" cy="452" r="12"/>
