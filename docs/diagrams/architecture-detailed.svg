            <rect x="40" y="310" width="200" height="84" rx="10"></rect>
            <rect x="300" y="70" width="180" height="64" rx="10"></rect>
            <rect x="520" y="70" width="200" height="64" rx="10"></rect>
            <rect x="760" y="70" width="200" height="64" rx="10"></rect>
            <rect x="520" y="240" width="220" height="76" rx="10" stroke-width="3"></rect>
            <rect x="800" y="240" width="220" height="64" rx="10"></rect>
            <rect x="520" y="360" width="220" height="64" rx="10"></rect>
            <rect x="800" y="360" width="220" height="64" rx="10"></rect>
            <rect x="520" y="480" width="220" height="64" rx="10"></rect>
            <rect x="800" y="480" width="220" height="64" rx="10"></rect>
            <rect x="520" y="668" width="220" height="76" rx="10"></rect>
            <rect x="800" y="668" width="220" height="76" rx="10"></rect>
            <rect x="300" y="300" width="180" height="80" rx="10" stroke-width="3"></rect>
            <rect x="300" y="650" width="180" height="100" rx="10"></rect>
            <rect x="1100" y="70" width="240" height="64" rx="10" stroke-dasharray="6,4"></rect>
            <rect x="1100" y="146" width="240" height="80" rx="10" stroke-dasharray="6,4"></rect>
            <rect x="1100" y="258" width="240" height="98" rx="10" stroke-dasharray="6,4"></rect>
            <rect x="1100" y="480" width="240" height="64" rx="10" stroke-dasharray="6,4"></rect>
            <rect x="1100" y="628" width="240" height="64" rx="10" stroke-dasharray="6,4"></rect>
          </g>

          <!-- step badges, one per step -->
          <g fill="#1e1e1e">
            <circle cx="140" cy="200" r="12"></circle><circle cx="500" cy="102" r="12"></circle><circle cx="880" cy="200" r="12"></circle>
            <circle cx="1060" cy="512" r="12"></circle><circle cx="630" cy="338" r="12"></circle><circle cx="460" cy="590" r="12"></circle>
            <circle cx="770" cy="706" r="12"></circle><circle cx="1060" cy="280" r="12"></circle><circle cx="650" cy="812" r="12"></circle>
            <circle cx="910" cy="452" r="12"></circle><circle cx="390" cy="515" r="12"></circle><circle cx="192" cy="230" r="12"></circle>
          </g>
          <!-- side request badges -->
          <g fill="#fbfaf7" stroke="#6b6b6b" stroke-width="1.4">
            <circle cx="1000" cy="40" r="12"></circle><circle cx="650" cy="56" r="12"></circle>
          </g>
        </g>

        <!-- text, kept crisp outside the hand-drawn filter -->
        <g font-family="'Architects Daughter', 'Comic Sans MS', cursive" fill="#1e1e1e">
          <text x="36" y="412" font-size="15" fill="#555555">Merchant’s browser</text>
          <text x="296" y="842" font-size="15" fill="#555555">GhostShopper server, one FastAPI process</text>
          <text x="1030" y="562" font-size="14" fill="#555555" text-anchor="end">the shopper agent</text>
          <text x="516" y="662" font-size="14" fill="#555555">the demo store</text>
          <text x="1096" y="842" font-size="15" fill="#555555">outside</text>

          <g font-size="17" text-anchor="middle">
            <text x="140" y="340">Dashboard</text>
            <text x="390" y="94">Runs API</text>
            <text x="620" y="98">Agent service</text>
            <text x="860" y="98">Fix wording</text>
            <text x="630" y="266">Shopper loop</text>
            <text x="910" y="266">Pay flows</text>
            <text x="630" y="386">Check engine</text>
            <text x="910" y="386">Order read-back</text>
            <text x="630" y="506">Recorder</text>
            <text x="910" y="506">Browser tools</text>
            <text x="630" y="694">Store pages</text>
            <text x="910" y="694">Checkout API</text>
            <text x="390" y="326">Score and trace</text>
            <text x="390" y="676">SQLite</text>
            <text x="1220" y="98">Channel3</text>
            <text x="1220" y="172">Language model</text>
            <text x="1220" y="284">PayPal</text>
            <text x="1220" y="506">Browser</text>
            <text x="1220" y="654">Your store (live)</text>
          </g>
          <g font-family="'Geist Mono', ui-monospace, monospace" font-size="10.5" fill="#555555" text-anchor="middle">
            <text x="140" y="360">react + vite</text><text x="140" y="378">live and results pages</text>
            <text x="390" y="112">runs.py, /api/runs</text><text x="390" y="126">main.py, /api/market</text>
            <text x="620" y="118">agent/service.py</text>
            <text x="860" y="118">explain.py, uses the model</text>
            <text x="630" y="286">agent/loop.py</text><text x="630" y="304">loop, budget, password guards</text>
            <text x="910" y="286">paypal_flow, vault_flow</text>
            <text x="630" y="406">engine.py + checks.py</text>
            <text x="910" y="406">agent/order_page.py</text>
            <text x="630" y="526">agent/recorder.py</text>
            <text x="910" y="526">agent/browser.py</text>
            <text x="630" y="714">store/app.py</text><text x="630" y="732">flaws.py toggles</text>
            <text x="910" y="714">/api/paypal, orders.py</text><text x="910" y="732">store/orders.py</text>
            <text x="390" y="346">scoring.py, trace.py</text><text x="390" y="364">no model involved</text>
            <text x="390" y="696">runs, steps, checks</text><text x="390" y="714">orders, store_orders</text><text x="390" y="732">scores</text>
            <text x="1220" y="118">market check, not scored</text>
            <text x="1220" y="192">nemotron or groq</text><text x="1220" y="210">scripted navigator without a key</text>
            <text x="1220" y="304">orders v2: create, capture</text><text x="1220" y="322">popup: the buyer approves</text><text x="1220" y="340">sandbox, or mock in practice</text>
            <text x="1220" y="526">playwright here, kernel hosted</text>
            <text x="1220" y="674">any link, browse only</text>
          </g>

          <!-- step numbers -->
          <g font-family="'Geist Mono', ui-monospace, monospace" font-size="11" font-weight="500" fill="#fbfaf7" text-anchor="middle">
            <text x="140" y="204">1</text><text x="500" y="106">2</text><text x="880" y="204">3</text>
            <text x="1060" y="516">4</text><text x="630" y="342">5</text><text x="460" y="594">6</text>
            <text x="770" y="710">7</text><text x="1060" y="284">8</text><text x="650" y="816">9</text>
            <text x="910" y="456">10</text><text x="390" y="519">11</text><text x="192" y="234">12</text>
          </g>
          <g font-family="'Geist Mono', ui-monospace, monospace" font-size="11" font-weight="500" fill="#555555" text-anchor="middle">
            <text x="1000" y="44">A</text><text x="650" y="60">B</text>
          </g>

          <!-- what happens, in order -->
          <text x="40" y="890" font-size="18">What happens during one check</text>
          <g font-size="15" fill="#1e1e1e">
            <text x="40" y="920">1  You start a check from the dashboard.</text>
            <text x="40" y="943">2  The runs API prepares a browser and the model, then starts the loop.</text>
            <text x="40" y="966">3  The model picks the next tool. Page text goes in as data, never as orders.</text>
            <text x="40" y="989">4  The tool acts in the browser, on the demo store or a live store.</text>
            <text x="40" y="1012">5  The check engine judges what the browser saw, with no model.</text>
            <text x="40" y="1035">6  The step, its screenshot and the checks are written to SQLite.</text>
            <text x="720" y="920">7  At checkout the store makes its own order and a PayPal order.</text>
            <text x="720" y="943">8  The buyer approves in PayPal’s popup, and PayPal captures.</text>
            <text x="720" y="966">9  The store settles its order. The flaws decide what it writes.</text>
            <text x="720" y="989">10  Our code, not the model, reads the order page back in the browser.</text>
            <text x="720" y="1012">11  On request, the score and the trace are built from SQLite.</text>
            <text x="720" y="1035">12  The dashboard polls and shows Live, then Results.</text>
          </g>
          <g font-size="15" fill="#555555">
            <text x="40" y="1064">A  The market check asks Channel3 for similar products. It never changes the score.</text>
            <text x="720" y="1064">B  On request the model rewords a fix. It can’t change which fix it is.</text>
          </g>
        </g>
      </svg>
