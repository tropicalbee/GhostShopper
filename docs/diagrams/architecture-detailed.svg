          <rect x="280" y="20" width="780" height="830" rx="12" fill="url(#hatch)" stroke="#1e1e1e" stroke-width="1.4" stroke-dasharray="7,5"></rect>
          <rect x="500" y="190" width="540" height="380" rx="10" fill="#fbfaf7" stroke="#1e1e1e" stroke-width="1.2" stroke-dasharray="4,4"></rect>
          <rect x="500" y="640" width="540" height="124" rx="10" fill="#fbfaf7" stroke="#1e1e1e" stroke-width="1.2" stroke-dasharray="4,4"></rect>
          <rect x="1080" y="20" width="300" height="830" rx="12" fill="url(#hatch)" stroke="#1e1e1e" stroke-width="1.4" stroke-dasharray="7,5"></rect>

