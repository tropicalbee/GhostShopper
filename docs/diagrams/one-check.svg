<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="one-check-title one-check-desc" id="one-check-root">
        <title id="one-check-title">One check, step by step</title>
        <desc id="one-check-desc">The agent clicks the PayPal button; the store creates its order and a PayPal order; the buyer approves; the capture completes; the store marks its order paid, or leaves it awaiting payment when that flaw is on; the agent reads the order page; when Results asks, the trace is built from the stored records.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #one-check-root { --paper: #0a0a0a; --ink: #ededed; --muted: #8f8f8f; --font-sans: 'Geist', system-ui, sans-serif; }
      #one-check-root { font-family: var(--font-sans); color: var(--ink); }
      #one-check-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#one-check-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="one-check-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7a7a7a"/></marker>
          <marker id="one-check-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ededed"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#0a0a0a"/>

        <!-- lifelines -->
        <g stroke="#ededed" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20">
          <line x1="110" y1="92" x2="110" y2="600"/>
          <line x1="310" y1="92" x2="310" y2="600"/>
          <line x1="510" y1="92" x2="510" y2="600"/>
          <line x1="710" y1="92" x2="710" y2="600"/>
          <line x1="890" y1="92" x2="890" y2="600"/>
        </g>

        <!-- alt fragment around the store settling its order -->
        <rect x="452" y="402" width="236" height="104" rx="4" fill="#ededed" stroke="#ededed" stroke-width="1" fill-opacity="0.04" stroke-opacity="0.22"/>
        <rect x="452" y="402" width="32" height="16" rx="2" fill="#0a0a0a" stroke="#ededed" stroke-width="1" stroke-opacity="0.22"/>
        <text x="468" y="414" fill="#8f8f8f" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">alt</text>
        <text x="492" y="414" fill="#8f8f8f" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">[store works]</text>
        <line x1="460" y1="456" x2="680" y2="456" stroke="#ededed" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.20"/>
        <text x="464" y="470" fill="#8f8f8f" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">[never marks paid flaw on]</text>

        <!-- messages -->
        <g font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#8f8f8f" text-anchor="middle">
          <line x1="110" y1="132" x2="306" y2="132" stroke="#7a7a7a" stroke-width="1.2" marker-end="url(#one-check-arrow)"/>
          <text x="210" y="124">PayPal button</text>

          <line x1="310" y1="168" x2="506" y2="168" stroke="#7a7a7a" stroke-width="1.2" marker-end="url(#one-check-arrow)"/>
          <text x="410" y="160">order #1042</text>

          <line x1="510" y1="204" x2="706" y2="204" stroke="#7a7a7a" stroke-width="1.2" marker-end="url(#one-check-arrow)"/>
          <text x="610" y="196">orders v2 create</text>

          <line x1="710" y1="240" x2="514" y2="240" stroke="#7a7a7a" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#one-check-arrow)"/>
          <text x="610" y="232">order id</text>

          <line x1="110" y1="276" x2="706" y2="276" stroke="#7a7a7a" stroke-width="1.2" marker-end="url(#one-check-arrow)"/>
          <rect x="164" y="259" width="92" height="12" rx="2" fill="#0a0a0a"/>
          <text x="210" y="268">buyer approves</text>

          <line x1="310" y1="312" x2="506" y2="312" stroke="#7a7a7a" stroke-width="1.2" marker-end="url(#one-check-arrow)"/>
          <text x="410" y="304">capture</text>

          <line x1="510" y1="348" x2="706" y2="348" stroke="#7a7a7a" stroke-width="1.2" marker-end="url(#one-check-arrow)"/>
          <text x="610" y="340">capture</text>

          <line x1="710" y1="384" x2="514" y2="384" stroke="#ededed" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#one-check-arrow-accent)"/>
          <text x="610" y="376" fill="#ededed">COMPLETED</text>

          <path d="M514,432 H554 V448 H518" fill="none" stroke="#7a7a7a" stroke-width="1.2" marker-end="url(#one-check-arrow)"/>
          <text x="562" y="444" text-anchor="start">mark order paid</text>
          <path d="M514,480 H554 V496 H518" fill="none" stroke="#7a7a7a" stroke-width="1.2" marker-end="url(#one-check-arrow)"/>
          <text x="562" y="492" text-anchor="start">stays awaiting payment</text>

          <line x1="110" y1="532" x2="306" y2="532" stroke="#7a7a7a" stroke-width="1.2" marker-end="url(#one-check-arrow)"/>
          <text x="210" y="524">reads order page</text>

          <line x1="890" y1="568" x2="514" y2="568" stroke="#ededed" stroke-width="1.2" marker-end="url(#one-check-arrow-accent)"/>
          <rect x="740" y="551" width="96" height="12" rx="2" fill="#0a0a0a"/>
          <text x="788" y="560" fill="#ededed">reads the records</text>
        </g>

        <!-- actors -->
        <g font-family="'Geist', system-ui, sans-serif" text-anchor="middle">
          <rect x="40" y="40" width="140" height="52" rx="6" fill="#181818" stroke="#ededed" stroke-width="1.2"/>
          <text x="110" y="63" fill="#ededed" font-size="12" font-weight="600">Shopper agent</text>
          <text x="110" y="79" fill="#8f8f8f" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">model + runtime</text>

          <rect x="240" y="40" width="140" height="52" rx="6" fill="#111111" stroke="#2e2e2e"/>
          <text x="310" y="63" fill="#ededed" font-size="12" font-weight="600">Demo store</text>
          <text x="310" y="79" fill="#8f8f8f" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">checkout page</text>

          <rect x="440" y="40" width="140" height="52" rx="6" fill="#111111" stroke="#2e2e2e"/>
          <text x="510" y="63" fill="#ededed" font-size="12" font-weight="600">Checkout API</text>
          <text x="510" y="79" fill="#8f8f8f" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">/api/paypal</text>

          <rect x="640" y="40" width="140" height="52" rx="6" fill="#111111" stroke="#2e2e2e" stroke-dasharray="4,3"/>
          <text x="710" y="63" fill="#ededed" font-size="12" font-weight="600">PayPal</text>
          <text x="710" y="79" fill="#8f8f8f" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">orders v2</text>

          <rect x="820" y="40" width="140" height="52" rx="6" fill="#181818" stroke="#ededed" stroke-width="1.2"/>
          <text x="890" y="63" fill="#ededed" font-size="12" font-weight="600">Purchase trace</text>
          <text x="890" y="79" fill="#8f8f8f" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">built on request</text>
        </g>

        <!-- legend -->
        <line x1="24" y1="616" x2="976" y2="616" stroke="#ededed" stroke-width="0.8" stroke-opacity="0.10"/>
        <g font-family="'Geist', system-ui, sans-serif" font-size="10" fill="#8f8f8f">
          <text x="24" y="642">Legend</text>
          <line x1="90" y1="638" x2="118" y2="638" stroke="#7a7a7a" stroke-width="1.2" marker-end="url(#one-check-arrow)"/>
          <text x="126" y="642">call</text>
          <line x1="180" y1="638" x2="208" y2="638" stroke="#7a7a7a" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#one-check-arrow)"/>
          <text x="216" y="642">reply</text>
          <line x1="276" y1="638" x2="304" y2="638" stroke="#ededed" stroke-width="1.2" marker-end="url(#one-check-arrow-accent)"/>
          <text x="312" y="642">what the trace reads</text>
          <rect x="480" y="630" width="22" height="14" rx="3" fill="#ededed" stroke="#ededed" fill-opacity="0.04" stroke-opacity="0.22"/>
          <text x="510" y="642">either branch happens, set by the store flaw</text>
        </g>
      </svg>
