<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>WebMCP fixture store</title>
<script src="https://www.sandbox.paypal.com/web-sdk/v6/core" defer></script>
<script src="https://example.test/webmcp/webmcp.v1.min.js" defer></script>
</head>
<body>
<p>Registers four tools a moment after load, the way a page that retries registration does.</p>
<script>
  var names = ['shopping.searchProducts', 'shopping.getProduct', 'shopping.initiateCheckout', 'shopping.completeCheckout'];
  var readOnly = {'shopping.searchProducts': true, 'shopping.getProduct': true};
  function tool(name) {
    return {
      name: name, description: 'Fixture ' + name, annotations: {readOnlyHint: !!readOnly[name]},
      inputSchema: {type: 'object', properties: {query: {type: 'string'}}},
      execute: function (args) {
        if (args && args.fail) throw new Error('fixture failure');
        var result = {tool: name, echo: args || {}};
        return Promise.resolve({content: [{type: 'text', text: JSON.stringify(result)}], structuredContent: result});
      },
    };
  }
  var tries = 0;
  var timer = setInterval(function () {
    tries += 1;
    var ctx = navigator.modelContext;
    if (!ctx || typeof ctx.registerTool !== 'function') { if (tries > 40) clearInterval(timer); return; }
    clearInterval(timer);
    setTimeout(function () {
      ctx.provideContext && ctx.provideContext({'@type': 'WebPage', name: document.title, storeId: 'fixture'});
      names.forEach(function (n) { ctx.registerTool(tool(n)); });
    }, 400);
  }, 100);
</script>
</body></html>
